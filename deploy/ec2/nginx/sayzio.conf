# Sayzio — Nginx site config (single-domain, path-routed layout).
#
# Routing (mirrors the Replit artifact.toml most-specific-first logic):
#   /api/healthz        -> Express API server on 127.0.0.1:8080 (exact match)
#   /api/contact[/*]    -> Express API server on 127.0.0.1:8080 (prefix match)
#   /api/v1/*           -> Laravel app via PHP-FPM (falls through to location /)
#   /                   -> Laravel app via PHP-FPM (all other requests)
#
# LOCKSTEP: the Express location blocks below must match the `paths` array in
#   artifacts/api-server/.replit-artifact/artifact.toml
# Adding a new Express-native path requires updating BOTH files and re-running:
#   pnpm --filter @workspace/scripts run check:api-server-paths
#
# Install — Ubuntu 22.04/24.04:
#   sudo cp deploy/ec2/nginx/sayzio.conf /etc/nginx/sites-available/sayzio.conf
#   # edit server_name + fastcgi_pass socket below
#   sudo ln -s /etc/nginx/sites-available/sayzio.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Install — Amazon Linux 2023 (no sites-available/sites-enabled; nginx loads
# /etc/nginx/conf.d/*.conf):
#   sudo cp deploy/ec2/nginx/sayzio.conf /etc/nginx/conf.d/sayzio.conf
#   # edit server_name + switch fastcgi_pass to unix:/run/php-fpm/www.sock
#   # (optional) comment out the default `server { listen 80; ... }` block in
#   # /etc/nginx/nginx.conf so this vhost is the only one answering
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL: run `sudo certbot --nginx -d yourdomain.com` AFTER the plain-HTTP config
# works; Certbot rewrites this file to add the 443 server block + redirects.

server {
    listen 80;
    listen [::]:80;

    # CHANGE ME: your domain (add extra names for custom user domains if you
    # terminate them here — or use a wildcard / default_server catch-all).
    server_name yourdomain.com;

    # Laravel public dir is the document root — Nginx serves static assets
    # (/build/*.css, /branding/*.png, /images/*, ...) directly; no server.php
    # static router is needed (that file exists only for Replit's `php -S`).
    root /var/www/sayzio/artifacts/1inme/public;
    index index.php;

    # Mirrors the PHP runtime limits (post_max_size = 25M).
    client_max_body_size 25m;

    # ------------------------------------------------------------------
    # Express API server (Node) — only the specific paths it natively
    # handles are proxied here.  All other /api/* requests (especially
    # /api/v1/*) are intentionally NOT listed and fall through to the
    # Laravel PHP-FPM handler via `location /` below.
    #
    # LOCKSTEP: keep in sync with:
    #   artifacts/api-server/.replit-artifact/artifact.toml  (paths = [...])
    # Run `pnpm --filter @workspace/scripts run check:api-server-paths`
    # after any change to validate the lockstep.
    # ------------------------------------------------------------------

    # /api/healthz — Express health probe (exact match)
    location = /api/healthz {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # /api/contact — Express contact form + admin inbox (prefix match covers
    # /api/contact, /api/contact/messages, /api/contact/messages/:id)
    location /api/contact {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ------------------------------------------------------------------
    # Health checks (Laravel built-ins) — /up is instant with NO DB
    # dependency: use it for any load-balancer/uptime probe. /up/schema
    # returns 503 on migration drift: use it for schema monitoring only,
    # never as the LB health check.
    # ------------------------------------------------------------------
    location = /up {
        try_files /nonexistent /index.php?$query_string;
        access_log off;
    }

    # ------------------------------------------------------------------
    # Laravel app — everything else.
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Never pass a non-existent script to FPM.
        try_files $uri =404;

        # PHP-FPM socket — pick the line for your distro:
        #   Ubuntu (ondrej PHP 8.4):  unix:/run/php/php8.4-fpm.sock
        #   Amazon Linux 2023:        unix:/run/php-fpm/www.sock
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        # fastcgi_pass unix:/run/php-fpm/www.sock;   # <- Amazon Linux 2023

        # Portable FastCGI setup (replaces Ubuntu-only snippets/fastcgi-php.conf;
        # fastcgi_params exists on both distros).
        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 120s;
    }

    # Never serve dotfiles (but allow ACME challenges for certbot webroot mode).
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Vite build output — long-lived immutable cache (hashed filenames).
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
