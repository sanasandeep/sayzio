# Sayzio — Nginx site config (single-domain, path-routed layout).
#
# Reproduces the Replit proxy routing on one host:
#   /            -> Laravel app via PHP-FPM (artifacts/1inme)
#   /api         -> Express API server proxied to 127.0.0.1:8080 (path NOT rewritten;
#                   the Express app handles its full /api base path itself)
#   /1inme-com/  -> Marketing site served as static files (SPA fallback to its index.html)
#
# Install:
#   sudo cp deploy/ec2/nginx/sayzio.conf /etc/nginx/sites-available/sayzio.conf
#   # edit server_name + paths below
#   sudo ln -s /etc/nginx/sites-available/sayzio.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL: run `sudo certbot --nginx -d yourdomain.com` AFTER the plain-HTTP config
# works; Certbot rewrites this file to add the 443 server block + redirects.
#
# Alternative layout: serve the marketing site on its own subdomain instead of
# /1inme-com/ — see marketing-subdomain.conf (build with MARKETING_BASE=/).

server {
    listen 80;
    listen [::]:80;

    # CHANGE ME: your domain (add extra names for custom user domains if you
    # terminate them here — or use a wildcard / default_server catch-all).
    server_name yourdomain.com;

    # Laravel public dir is the document root — Nginx serves static assets
    # (/build/*.css, /branding/*.png, /images/*, ...) directly; no server.php
    # static router is needed (that file exists only for Replit's `php -S`).
    root /var/www/sayzio/artifacts/1inme/public;
    index index.php;

    # Mirrors the PHP runtime limits (post_max_size = 25M).
    client_max_body_size 25m;

    # ------------------------------------------------------------------
    # Express API server (Node) — proxied, path preserved.
    # ------------------------------------------------------------------
    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ------------------------------------------------------------------
    # Marketing site — static files with SPA fallback.
    # Built with: BASE_PATH=/1inme-com/ pnpm --filter @workspace/1inme-com run build
    # Output: artifacts/1inme-com/dist/public
    # ------------------------------------------------------------------
    location /1inme-com/ {
        alias /var/www/sayzio/artifacts/1inme-com/dist/public/;
        try_files $uri $uri/index.html /1inme-com/index.html;

        location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|webp|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ------------------------------------------------------------------
    # Health checks (Laravel built-ins) — /up is instant with NO DB
    # dependency: use it for any load-balancer/uptime probe. /up/schema
    # returns 503 on migration drift: use it for schema monitoring only,
    # never as the LB health check.
    # ------------------------------------------------------------------
    location = /up {
        try_files /nonexistent /index.php?$query_string;
        access_log off;
    }

    # ------------------------------------------------------------------
    # Laravel app — everything else.
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 120s;
    }

    # Never serve dotfiles (but allow ACME challenges for certbot webroot mode).
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Vite build output — long-lived immutable cache (hashed filenames).
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
