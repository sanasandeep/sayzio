# Sayzio — OPTIONAL Nginx config serving the marketing site on its own
# subdomain (e.g. www.yourdomain.com or get.yourdomain.com) instead of the
# path-routed /1inme-com/ location in sayzio.conf.
#
# If you use this, build the marketing site with a root base path:
#   MARKETING_BASE=/ bash deploy/ec2/deploy.sh
# (BASE_PATH=/ makes all asset URLs root-relative.)
#
# Remove the `location /1inme-com/` block from sayzio.conf when switching, and
# point the marketing DNS record at the same EC2 IP. Issue a cert with:
#   sudo certbot --nginx -d www.yourdomain.com
#
# Install location (pure static config — no PHP, works as-is on both distros):
#   Ubuntu:            /etc/nginx/sites-available/ + symlink into sites-enabled/
#   Amazon Linux 2023: /etc/nginx/conf.d/marketing-subdomain.conf

server {
    listen 80;
    listen [::]:80;

    # CHANGE ME
    server_name www.yourdomain.com;

    root /var/www/sayzio/artifacts/1inme-com/dist/public;
    index index.html;

    location / {
        try_files $uri $uri/index.html /index.html;
    }

    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
