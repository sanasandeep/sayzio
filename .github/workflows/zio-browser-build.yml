name: SayZio Browser Build & Package

on:
  push:
    branches:
      - main
    paths:
      - 'artifacts/zio-browser/**'
  pull_request:
    paths:
      - 'artifacts/zio-browser/**'
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub Release'
        type: boolean
        default: false

defaults:
  run:
    working-directory: artifacts/zio-browser

jobs:
  # ── Test & typecheck ────────────────────────────────────────────────────────
  test:
    name: Test & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

  # ── macOS build ─────────────────────────────────────────────────────────────
  build-mac:
    name: Build macOS (universal)
    runs-on: macos-14
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event.inputs.release == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build renderer
        run: pnpm run build:renderer

      - name: Build main process
        run: pnpm run build:main && pnpm run build:preload

      - name: Package macOS (unsigned)
        run: pnpm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # To enable code signing, add:
          # CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          # CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sayzio-browser-mac
          path: |
            artifacts/zio-browser/release/*.dmg
            artifacts/zio-browser/release/*.zip
          if-no-files-found: error
          retention-days: 14

  # ── Windows build ────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event.inputs.release == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build renderer
        run: pnpm run build:renderer

      - name: Build main process
        run: pnpm run build:main && pnpm run build:preload

      - name: Package Windows (unsigned)
        run: pnpm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # To enable code signing, add:
          # WIN_CSC_LINK: ${{ secrets.WIN_CERT_P12_BASE64 }}
          # WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sayzio-browser-windows
          path: |
            artifacts/zio-browser/release/*.exe
            artifacts/zio-browser/release/*.msi
          if-no-files-found: warn
          retention-days: 14

  # ── GitHub Release ────────────────────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-mac, build-windows]
    if: github.event.inputs.release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: sayzio-browser-mac
          path: release/mac

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: sayzio-browser-windows
          path: release/windows

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zio-browser-v${{ steps.version.outputs.version }}
          name: SayZio Browser v${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: true
          files: |
            release/mac/*
            release/windows/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
