name: Laravel tests (PostgreSQL)

# Run the full PHPUnit suite on every change to the 1inme Laravel app.
#
# Sibling to laravel-migrations.yml: that workflow guards the migration
# pipeline by running `migrate:fresh` against a real Postgres service, but
# the actual model / controller / feature tests under artifacts/1inme/tests/
# were never executed automatically — so regressions in business logic
# could ship unnoticed. This workflow closes that gap by running
# `php artisan test` against the same PostgreSQL service.
#
# We deliberately point the suite at Postgres (rather than the sqlite
# in-memory default baked into phpunit.xml) so the tests exercise the same
# database engine production runs against — the original Postgres-only
# regressions (e.g. jsonb `?` operator collisions) were exactly the kind
# of thing a sqlite-backed suite would silently miss.

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/1inme/**'
      - '.github/workflows/laravel-tests.yml'
  pull_request:
    paths:
      - 'artifacts/1inme/**'
      - '.github/workflows/laravel-tests.yml'
  workflow_dispatch:

jobs:
  phpunit-postgres:
    name: php artisan test against PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: onein_me_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: artifacts/1inme

    env:
      # Push the database config into the process environment so it wins
      # over both the .env file and the sqlite defaults hard-coded in
      # phpunit.xml (PHPUnit's <env> elements do not override values that
      # are already set in the environment unless force="true").
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: onein_me_ci
      DB_USERNAME: postgres
      DB_PASSWORD: password

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo, pdo_pgsql, pgsql, bcmath, gd, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: artifacts/1inme/vendor
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('artifacts/1inme/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php8.3-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare .env for CI
        run: |
          cp .env.example .env
          php artisan key:generate
          # Mirror the env vars above into .env so anything that reads the
          # file directly (rather than getenv()) still hits Postgres.
          sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=pgsql|' .env
          sed -i 's|^DB_HOST=.*|DB_HOST=127.0.0.1|' .env
          sed -i 's|^DB_PORT=.*|DB_PORT=5432|' .env
          sed -i 's|^DB_DATABASE=.*|DB_DATABASE=onein_me_ci|' .env
          sed -i 's|^DB_USERNAME=.*|DB_USERNAME=postgres|' .env
          sed -i 's|^DB_PASSWORD=.*|DB_PASSWORD=password|' .env

      - name: Wait for PostgreSQL to accept connections
        run: |
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres; then
              echo "Postgres is ready."
              exit 0
            fi
            echo "Waiting for Postgres... ($i)"
            sleep 1
          done
          echo "Postgres never became ready" >&2
          exit 1
        env:
          PGPASSWORD: password

      - name: Run PHPUnit suite (the actual guard)
        # --parallel uses brianium/paratest to fan tests out across multiple
        # worker processes, each with its own per-worker Postgres database
        # (onein_me_ci_test_1, _test_2, ...). The default `postgres`
        # superuser on the service container can CREATE DATABASE, so no
        # extra grants are needed. Cuts CI wall time noticeably as the
        # suite grows past 60+ test files.
        run: php artisan test --parallel

  database-guard:
    name: Dev-database safety net guard
    runs-on: ubuntu-latest

    # Tests\TestCase::guardAgainstNonTestDatabase() aborts the whole PHPUnit run
    # before any migration when the resolved database is not a recognized test
    # database. It is the only thing stopping a stray DB_DATABASE=postgres from
    # wiping the shared dev/live RDS (this actually happened once). Nothing else
    # verifies that guard still works, so this job runs the real guard (via
    # reflection on the production class, never a copy of its logic) across the
    # key scenarios and fails if any of them regresses.
    #
    # The guard only reads/merges config and opens NO database connection, so
    # this job needs no Postgres service — just PHP, a Composer install, and a
    # minimal .env so the app can boot.

    defaults:
      run:
        working-directory: artifacts/1inme

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo, pdo_pgsql, pgsql, bcmath, gd, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: artifacts/1inme/vendor
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('artifacts/1inme/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php8.3-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare .env for CI
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verify the destructive-database guard is intact
        # The script itself unsets CI / GITHUB_ACTIONS per scenario, so the
        # "aborts locally" cases are exercised correctly even though this job
        # runs inside GitHub Actions.
        run: composer test:db-guard

  php84-deprecations:
    name: PHP 8.4 deprecation guard
    runs-on: ubuntu-latest

    # PHP 8.4 emits a compile-time deprecation for every implicitly-nullable
    # parameter (`Type $x = null` missing the explicit `?`), and these become
    # hard errors in a future PHP version. The phpunit-postgres job above runs
    # on PHP 8.3, which never raises them, so this dedicated job pins PHP 8.4
    # and lints the codebase to catch the warnings before they pile up.
    #
    # The check is a pure `php -l` scan (see scripts/check-php-deprecations.php):
    # it never executes app code, so it needs no Composer install and no
    # database service — just PHP and the source tree.

    defaults:
      run:
        working-directory: artifacts/1inme

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Scan app/ and tests/ for PHP 8.4 deprecations
        run: composer lint:deprecations
