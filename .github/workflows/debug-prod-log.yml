name: Debug prod log
on:
  workflow_dispatch:

jobs:
  taillog:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        run: |
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Tail Laravel log
        run: |
          ssh -i ~/.ssh/deploy_key "sayzio@${{ secrets.DEPLOY_HOST }}" \
            'L=/var/www/sayzio/artifacts/1inme/storage/logs/laravel.log; echo "== last error blocks =="; grep -n "production.ERROR" "$L" | tail -5; echo; awk "NR>=$(grep -n \"production.ERROR\" \"$L\" | tail -1 | cut -d: -f1)" "$L" | head -80'
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
