kind = "web"
previewPath = "/1inme-com/"
title = "1INME Marketing"
version = "1.0.0"
id = "artifacts/1inme-com"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/1inme-com/" ]
localPort = 20346

[services.development]
run = "pnpm --filter @workspace/1inme-com run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/1inme-com", "run", "build" ]
publicDir = "artifacts/1inme-com/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20346"
BASE_PATH = "/1inme-com/"
