kind = "web"
previewPath = "/"
title = "1INME"
version = "1.0.0"

[[services]]
localPort = 5000
name = "web"
paths = ["/"]

[services.development]
run = "cd /home/runner/workspace/artifacts/1inme && php artisan serve --host=0.0.0.0 --port=5000"

[services.development.env]
PORT = "5000"

[services.production.run]
args = ["php", "artifacts/1inme/artisan", "serve", "--host=0.0.0.0", "--port=5000"]

[services.production.run.env]
PORT = "5000"
APP_ENV = "production"

[services.production.health.startup]
path = "/"
