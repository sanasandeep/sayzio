kind = "web"
previewPath = "/"
title = "1INME"
version = "1.0.0"

[[services]]
localPort = 5000
name = "web"
paths = ["/"]

# Dev startup builds the Vite/Tailwind v4 assets if the @vite() manifest at
# public/build/manifest.json is missing, then writes a boot timestamp and serves.
# public/build is gitignored, so a fresh dev environment has no manifest and every
# Blade page using @vite() would 500 with ViteManifestNotFoundException — building
# on startup keeps dev durable across environment restarts without committing build
# output.
#
# STALE VIEW CACHE NOTE: Tailwind's content auto-detection also scans Laravel's
# compiled-blade cache (storage/framework/views/*.php). If those cached files hold
# pre-sweep class tokens (e.g. retired purple), Tailwind regenerates them back into
# public/build CSS. So we run `php artisan view:clear` BEFORE the asset build to
# clear the compiled-blade cache at the source (see
# .agents/memory/tailwind-scans-compiled-views.md).
#
# READINESS PROBE NOTE: the Replit dev readiness probe is hard-wired to poll the
# preview path "/" — it ignores [services.development.health.startup].path (verified:
# zero "/up" hits in the dev log when that was set) — and enforces a tight per-response
# latency bound, so it rejects the home page's ~1s warm / ~3-5s cold Blade render and
# tears down the otherwise-healthy server. The fix is the dev-only DevStartupProbe
# middleware (app/Modules/Common/Middleware), which answers "/" with an instant 200
# splash for WINDOW_MS after boot. It keys off the boot timestamp written below into
# storage/framework/cache/dev_boot_ms; the real home page serves normally once the
# window elapses, and the middleware is a no-op in production.
[services.development]
run = "cd /home/runner/workspace/artifacts/1inme && { [ -f public/build/manifest.json ] || { php artisan view:clear && pnpm --dir /home/runner/workspace/artifacts/1inme run build; }; } && mkdir -p storage/framework/cache && date +%s%3N > storage/framework/cache/dev_boot_ms && PHP_CLI_SERVER_WORKERS=10 php -d upload_max_filesize=20M -d post_max_size=25M -d memory_limit=256M artisan serve --host=0.0.0.0 --port=5000 --no-reload"

[services.development.env]
PORT = "5000"

# Production build compiles the Vite/Tailwind v4 assets (resources/css/app.css +
# resources/js/app.js) so the @vite() manifest at public/build/manifest.json
# resolves at runtime — the Blade views no longer load the Tailwind CDN.
# `php artisan view:clear` runs BEFORE the asset build so Tailwind never scans a
# stale compiled-blade cache and regenerates retired classes into the CSS (see
# .agents/memory/tailwind-scans-compiled-views.md). The trailing view:clear stays
# to leave a clean compiled-view cache after deploy.
[services.production.build]
args = ["sh", "-c", "pnpm install --frozen-lockfile && (cd artifacts/1inme && php artisan view:clear) && pnpm --dir artifacts/1inme run build && cd artifacts/1inme && composer install --no-dev --optimize-autoloader --no-interaction && php artisan config:clear && php artisan route:clear && php artisan view:clear"]

# Deploy migration policy (Task #1679): KEEP SERVING on migrate failure.
# `php artisan migrate --force` runs first; if it fails we fall back to
# `php artisan db:reconcile-migrations --force`, which heals orphaned
# (applied-but-unrecorded) migrations left by interrupted runs over the distant
# RDS, then applies the rest — additively, never dropping tables. If that still
# fails we log a loud "::1inme:: DEPLOY MIGRATION FAILED" marker + the pending
# list to stderr but STILL boot the web server, trading a possibly-incomplete
# schema for avoiding full downtime. The startup health check below stays on "/"
# (not /up/schema) on purpose so a partial schema does NOT fail the deploy.
# Proactive detection of the resulting drift is handled in-app: the hourly
# db:check-pending-migrations command alerts admins (in-app + email), the admin
# dashboard shows a banner, and GET /up/schema returns 503 for external
# monitoring.
[services.production.run]
args = ["sh", "-c", '''cd artifacts/1inme && { php artisan migrate --force; mst=$?; if [ "$mst" -ne 0 ]; then echo "::1inme:: migrate --force exited $mst — attempting self-healing reconcile of orphaned migrations..." >&2; php artisan db:reconcile-migrations --force; mst=$?; fi; if [ "$mst" -ne 0 ]; then echo "::1inme:: DEPLOY MIGRATION FAILED (exit=$mst) — database schema may be incomplete (missing tables/columns); workspace-backed and other pages may 500. Investigate immediately. Pending migrations:" >&2; php artisan migrate:status 2>&1 | grep -i pending >&2 || true; fi; } ; exec php -d variables_order=EGPCS -d upload_max_filesize=20M -d post_max_size=25M -d memory_limit=256M -S 0.0.0.0:5000 -t public public/index.php''']

[services.production.run.env]
PORT = "5000"
APP_ENV = "production"
APP_DEBUG = "false"
DB_PERSISTENT = "false"

[services.production.health.startup]
path = "/"
