kind = "web"
previewPath = "/"
title = "1INME"
version = "1.0.0"

[[services]]
localPort = 5000
name = "web"
paths = ["/"]

[services.development]
run = "cd /home/runner/workspace/artifacts/1inme && PHP_CLI_SERVER_WORKERS=10 php -d upload_max_filesize=20M -d post_max_size=25M -d memory_limit=256M artisan serve --host=0.0.0.0 --port=5000 --no-reload"

[services.development.env]
PORT = "5000"

[services.production.build]
args = ["sh", "-c", "cd artifacts/1inme && composer install --no-dev --optimize-autoloader --no-interaction && php artisan config:clear && php artisan route:clear && php artisan view:clear"]

# Deploy migration policy (Task #1679): KEEP SERVING on migrate failure.
# `php artisan migrate --force` runs first; if it fails we log a loud
# "::1inme:: DEPLOY MIGRATION FAILED" marker + the pending list to stderr but
# STILL boot the web server, trading a possibly-incomplete schema for avoiding
# full downtime. The startup health check below stays on "/" (not /up/schema)
# on purpose so a partial schema does NOT fail the deploy. Proactive detection
# of the resulting drift is handled in-app: the hourly db:check-pending-migrations
# command alerts admins (in-app + email), the admin dashboard shows a banner,
# and GET /up/schema returns 503 for external monitoring.
[services.production.run]
args = ["sh", "-c", '''cd artifacts/1inme && { php artisan migrate --force; mst=$?; if [ "$mst" -ne 0 ]; then echo "::1inme:: DEPLOY MIGRATION FAILED (exit=$mst) — database schema may be incomplete (missing tables/columns); workspace-backed and other pages may 500. Investigate immediately. Pending migrations:" >&2; php artisan migrate:status 2>&1 | grep -i pending >&2 || true; fi; } ; exec php -d variables_order=EGPCS -d upload_max_filesize=20M -d post_max_size=25M -d memory_limit=256M -S 0.0.0.0:5000 -t public public/index.php''']

[services.production.run.env]
PORT = "5000"
APP_ENV = "production"
APP_DEBUG = "false"
DB_PERSISTENT = "false"

[services.production.health.startup]
path = "/"
