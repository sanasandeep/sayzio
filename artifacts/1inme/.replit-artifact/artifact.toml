kind = "web"
previewPath = "/"
title = "1INME"
version = "1.0.0"

[[services]]
localPort = 5000
name = "web"
paths = ["/"]

[services.development]
run = "cd /home/runner/workspace/artifacts/1inme && php -d upload_max_filesize=20M -d post_max_size=25M -d memory_limit=256M artisan serve --host=0.0.0.0 --port=5000"

[services.development.env]
PORT = "5000"

[services.production.build]
args = ["sh", "-c", "cd artifacts/1inme && composer install --no-dev --optimize-autoloader --no-interaction && php artisan config:clear && php artisan route:clear && php artisan view:clear"]

[services.production.run]
args = ["sh", "-c", '''cd artifacts/1inme && { php artisan migrate --force 2>&1 || echo "[1inme] migrate skipped/failed - continuing to serve"; } && exec php artisan serve --host=0.0.0.0 --port=5000''']

[services.production.run.env]
PORT = "5000"
APP_ENV = "production"
APP_DEBUG = "false"

[services.production.health.startup]
path = "/"
