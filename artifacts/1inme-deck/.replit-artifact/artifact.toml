kind = "slides"
previewPath = "/1inme-deck/"
title = "1INME Product Deck"
version = "1.0.0"
id = "artifacts/1inme-deck"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/1inme-deck/" ]
localPort = 22245

[services.development]
run = "pnpm --filter @workspace/1inme-deck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/1inme-deck", "run", "build" ]
publicDir = "artifacts/1inme-deck/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22245"
BASE_PATH = "/1inme-deck/"
