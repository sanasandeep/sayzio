openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contact
    description: Contact form operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /contact:
    post:
      operationId: submitContactMessage
      tags: [contact]
      summary: Submit a contact message
      description: >
        Accepts a contact form submission from the marketing site, stores it for
        the team, and returns the result. Includes a honeypot field for spam
        protection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMessageInput"
      responses:
        "201":
          description: Message accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMessageResult"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contact/messages:
    get:
      operationId: listContactMessages
      tags: [contact]
      summary: List contact messages (admin)
      description: >
        Returns stored contact form submissions, newest first. Admin-only:
        requires a bearer token. Supports pagination, a free-text search across
        name/email/subject/message, and filtering by read status.
      security:
        - adminBearer: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, new, read]
            default: all
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: A page of contact messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMessageList"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Admin inbox is not configured on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contact/messages/{id}:
    patch:
      operationId: updateContactMessage
      tags: [contact]
      summary: Update a contact message's status (admin)
      description: >
        Marks a contact message as read or new (handled / unhandled).
        Admin-only: requires a bearer token.
      security:
        - adminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMessageStatusUpdate"
      responses:
        "200":
          description: The updated contact message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMessageResource"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Admin inbox is not configured on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      description: >
        Shared admin token, sent as `Authorization: Bearer <token>`. The token
        is configured on the API server via the CONTACT_ADMIN_TOKEN environment
        variable.
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ContactMessageInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 255
        subject:
          type: string
          minLength: 1
          maxLength: 200
        message:
          type: string
          minLength: 1
          maxLength: 5000
        website:
          type: string
          maxLength: 255
          description: >
            Honeypot field. Must be left empty by real users; populated
            submissions are silently dropped as spam.
      required:
        - name
        - email
        - subject
        - message
    ContactMessageResult:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
    ContactMessage:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        subject:
          type: string
        message:
          type: string
        status:
          type: string
          enum: [new, read]
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - subject
        - message
        - status
        - readAt
        - createdAt
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
      required:
        - page
        - perPage
        - total
        - totalPages
    ContactMessageList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ContactMessage"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required:
        - data
        - meta
    ContactMessageResource:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/ContactMessage"
      required:
        - data
    ContactMessageStatusUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [new, read]
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            code:
              type: string
          required:
            - message
      required:
        - error

